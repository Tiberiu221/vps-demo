# /etc/nginx/sites-available/vps-demo  (symlinked into sites-enabled, default site removed)
# Public port 80 -> Node app on 127.0.0.1:3000.
#
# HTTPS, only if a domain's DNS A record points to this server: replace "server_name _;"
# with "server_name DOMAIN;", reload nginx, apt-get install -y certbot python3-certbot-nginx, then:
#   certbot --nginx -d DOMAIN
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
